<app-finder (search)="searchCountry($event)"></app-finder>

@if (!hasSearched && countries.length > initialCountryCount) {
  <div class="show-all">
    <button (click)="toggleCountries()">
      {{ showAll ? 'Mostrar menos' : 'Mostrar todos' }}
    </button>
  </div>
}

@if (isLoadingCountries) {
  <p class="loading-message">Cargando países...</p>
} @else if (countriesError) {
  <p>{{ countriesError }}</p>
} @else {
  <app-country-list
    [countries]="visibleCountries"
    [hasSearched]="hasSearched">
  </app-country-list>
}
